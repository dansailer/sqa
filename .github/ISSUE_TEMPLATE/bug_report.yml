name: Bug report
description: Something in sqa does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include the command you ran and the output (remove any tokens or sensitive project data).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: sqa version
      placeholder: output of `sqa version`
    validations:
      required: true
  - type: input
    id: sonar
    attributes:
      label: sonar CLI and SonarQube Server versions
      placeholder: e.g. sonar 1.12.0, SonarQube Server 2025.4
  - type: input
    id: os
    attributes:
      label: OS / architecture
      placeholder: e.g. macOS 26 arm64
