name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tools pinned in mise.toml / mise.lock (`mise install --locked`)
      # and caches them. The mise binary is verified against its signed checksums.
      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          cache: true

      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.lock') }}
          restore-keys: |
            go-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-

      - name: Test
        run: mise run test

  build:
    name: Build linux/amd64 and windows/amd64 (bundled sonar)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tools pinned in mise.toml / mise.lock (`mise install --locked`)
      # and caches them. The mise binary is verified against its signed checksums.
      - name: Set up mise
        uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          version: 2026.11.9
          cache: true

      - name: Cache Go modules and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-${{ hashFiles('go.sum', 'mise.lock') }}
          restore-keys: |
            go-${{ github.workflow }}-${{ github.job }}-${{ runner.os }}-

      # Always a fresh download for releases (no cache), verified against the
      # SHA-256 compiled into sqa.
      - name: Fetch and verify sonar (linux)
        run: mise run fetch-sonar

      - name: Test embedded sonar (linux)
        run: go test -tags bundled_sonar ./internal/sonarcli/

      # Licence texts of every Go module in sqa (and of Go itself) for both
      # archives; fails if a module ships no licence file.
      - name: Collect Go licence files
        run: mise run go-licenses

      # GPL-3.0 §6(d) (via LGPL-3.0 §4): the corresponding source of the
      # bundled sonar is offered from the same place as the binaries. Verified
      # against the SHA-256 pinned in mise.toml; dist/*.tar.gz picks it up below.
      - name: Fetch and verify sonar source
        run: mise run fetch-sonar-source

      - name: Build and package linux/amd64
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="sqa_${version}_linux_amd64"
          VERSION="${TAG}" COMMIT="${GITHUB_SHA}" mise run build-bundled
          mkdir -p "build/${name}/licenses" dist
          mv sqa "build/${name}/sqa"
          cp LICENSE README.md THIRD_PARTY_NOTICES.md "build/${name}/"
          cp licenses/sonarqube-cli-LGPL-3.0.txt licenses/sonarqube-cli-GPL-3.0.txt "build/${name}/licenses/"
          cp -R build/licenses/go "build/${name}/licenses/go"
          test -s "build/${name}/licenses/go/MODULES.txt"
          # Smoke test: the bundled sonar extracts, verifies and runs.
          home="$(mktemp -d)"
          HOME="${home}" "build/${name}/sqa" version
          HOME="${home}" "build/${name}/sqa" setup
          mtime="$(git log -1 --format=%cI)"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="${mtime}" \
            -C build -czf "dist/${name}.tar.gz" "${name}"
          ls -l "build/${name}/sqa" dist

      - name: Fetch and verify sonar (windows)
        run: mise run fetch-sonar-windows

      - name: Build and package windows/amd64
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="sqa_${version}_windows_amd64"
          VERSION="${TAG}" COMMIT="${GITHUB_SHA}" mise run build-bundled-windows
          mkdir -p "build/${name}/licenses" dist
          mv sqa.exe "build/${name}/sqa.exe"
          cp LICENSE README.md THIRD_PARTY_NOTICES.md "build/${name}/"
          cp licenses/sonarqube-cli-LGPL-3.0.txt licenses/sonarqube-cli-GPL-3.0.txt "build/${name}/licenses/"
          cp -R build/licenses/go "build/${name}/licenses/go"
          test -s "build/${name}/licenses/go/MODULES.txt"
          # No smoke test: this is a Windows binary cross-compiled on Linux.
          python3 - "$name" <<'PY'
          import sys
          import zipfile
          from pathlib import Path
          name = Path("build") / sys.argv[1]
          dest = Path("dist") / (sys.argv[1] + ".zip")
          dest.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(dest, "w", compression=zipfile.ZIP_DEFLATED) as z:
              for p in sorted(name.rglob("*")):
                  if p.is_file():
                      z.write(p, p.relative_to(name))
          print(dest, dest.stat().st_size)
          PY
          ls -l "build/${name}/sqa.exe" dist

      - name: Upload archives
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqa-archives
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sqa-*
          path: dist
          merge-multiple: true

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/sqa_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          # *.tar.gz includes sonarqube-cli-<version>-source.tar.gz; never publish without it.
          ls sonarqube-cli-*-source.tar.gz
          sha256sum -- *.tar.gz *.zip sqa_sbom.spdx.json > checksums.txt
          cat checksums.txt

      # Verify with: gh attestation verify <archive> --repo dansailer/sqa
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --verify-tag \
            --title "${TAG}" \
            --generate-notes \
            dist/*.tar.gz dist/*.zip dist/checksums.txt dist/sqa_sbom.spdx.json
