name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test -race ./...

  build:
    name: Build linux/amd64 (bundled sonar)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      # Always a fresh download for releases (no cache), verified against the
      # SHA-256 compiled into sqa.
      - name: Fetch and verify sonar
        run: make fetch-sonar

      - name: Test embedded sonar
        run: go test -tags bundled_sonar ./internal/sonarcli/

      - name: Build and package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          name="sqa_${version}_linux_amd64"
          make build-bundled VERSION="${TAG}" COMMIT="${GITHUB_SHA}"
          mkdir -p "build/${name}/licenses" dist
          mv sqa "build/${name}/sqa"
          cp LICENSE README.md THIRD_PARTY_NOTICES.md "build/${name}/"
          cp licenses/sonarqube-cli-LGPL-3.0.txt licenses/sonarqube-cli-GPL-3.0.txt "build/${name}/licenses/"
          # Smoke test: the bundled sonar extracts, verifies and runs.
          home="$(mktemp -d)"
          HOME="${home}" "build/${name}/sqa" version
          HOME="${home}" "build/${name}/sqa" setup
          mtime="$(git log -1 --format=%cI)"
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="${mtime}" \
            -C build -czf "dist/${name}.tar.gz" "${name}"
          ls -l "build/${name}/sqa" dist

      - name: Upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sqa-linux-amd64
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sqa-*
          path: dist
          merge-multiple: true

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/sqa_sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum -- *.tar.gz sqa_sbom.spdx.json > checksums.txt
          cat checksums.txt

      # GitHub only stores attestations for public repos (or org repos on paid plans).
      # Skipped while the repo is private; the release still ships checksums.txt and an SBOM.
      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/checksums.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "${TAG}" \
            --verify-tag \
            --title "${TAG}" \
            --generate-notes \
            dist/*.tar.gz dist/checksums.txt dist/sqa_sbom.spdx.json
