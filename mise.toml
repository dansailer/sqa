# Tools and tasks for sqa. `mise install` sets up the pinned toolchain,
# `mise tasks` lists the tasks, `mise run <task>` runs one. CI runs the same
# tasks. Release builds embed the official sonar CLI (linux/amd64 only) with
# the bundled_sonar build tag.
#
# Overrides: VERSION (default dev) and COMMIT (default `git rev-parse HEAD`),
# e.g. `VERSION=v0.1.0 mise run build-bundled`.

[settings]
lockfile = true
# Go comes from the toolchain line in go.mod.
idiomatic_version_file_enable_tools = ["go"]

[tools]
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:koalaman/shellcheck" = "0.11.0"

[vars]
sonar_bin = "internal/sonarcli/bundled/sonar-linux-amd64"
ldflags = '-s -w -X github.com/dansailer/sqa/internal/cli.version=${VERSION:-dev} -X github.com/dansailer/sqa/internal/cli.commit=${COMMIT:-$(git rev-parse HEAD 2>/dev/null)}'

[tasks.build]
description = "Build ./sqa without a bundled sonar (uses sonar.path, `sqa setup` or PATH)"
env = { CGO_ENABLED = "0" }
run = 'go build -trimpath -ldflags "{{vars.ldflags}}" -o sqa ./cmd/sqa'

[tasks.fetch-sonar]
description = "Download the pinned sonar for linux/amd64 and verify its SHA-256"
run = "go run ./tools/fetch-sonar -o {{vars.sonar_bin}}"

[tasks.sonar-version]
description = "Print the pinned sonar version"
quiet = true
run = "go run ./tools/fetch-sonar -print-version"

[tasks.build-bundled]
description = "Build linux/amd64 ./sqa with the official sonar embedded"
depends = ["fetch-sonar"]
env = { CGO_ENABLED = "0", GOOS = "linux", GOARCH = "amd64" }
run = [
  'go build -tags bundled_sonar -trimpath -ldflags "{{vars.ldflags}}" -o sqa ./cmd/sqa',
  "ls -l sqa",
]

[tasks.test]
description = "Run the tests with the race detector"
run = "go test -race ./..."

[tasks.test-bundled]
description = "go vet and tests with -tags bundled_sonar, including the embedded-binary check"
depends = ["fetch-sonar"]
run = [
  "go vet -tags bundled_sonar ./...",
  "go test -race -tags bundled_sonar ./...",
]

[tasks.lint-sh]
description = "shellcheck install.sh and its tests"
run = "shellcheck install.sh testdata/install/test.sh"

[tasks.test-install]
description = "Run install.sh against a local fake release (checksum mismatch included)"
run = "sh testdata/install/test.sh"

[tasks.lint]
description = "go vet, golangci-lint and shellcheck"
run = ["go vet ./...", "golangci-lint run", { task = "lint-sh" }]

[tasks.vulncheck]
description = "Scan dependencies and code for known vulnerabilities (govulncheck)"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./..."

[tasks.clean]
description = "Remove ./sqa and the fetched sonar binary"
run = "rm -f sqa {{vars.sonar_bin}}"

[tasks.all]
description = "test, test-install, lint-sh, then build"
depends = ["test"]
run = [{ task = "test-install" }, { task = "lint-sh" }, { task = "build" }]
