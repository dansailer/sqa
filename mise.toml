# Tools and tasks for sqa. `mise install` sets up the pinned toolchain,
# `mise tasks` lists the tasks, `mise run <task>` runs one. CI runs the same
# tasks. Release builds embed the official sonar CLI (linux/amd64 or
# windows/amd64) with the bundled_sonar build tag.
#
# Overrides: VERSION (default dev) and COMMIT (default `git rev-parse HEAD`),
# e.g. `VERSION=v0.1.0 mise run build-bundled`.

[settings]
lockfile = true
# Go comes from the toolchain line in go.mod.
idiomatic_version_file_enable_tools = ["go"]

[tools]
"aqua:golangci/golangci-lint" = "2.15.0"
"aqua:koalaman/shellcheck" = "0.11.0"

[vars]
sonar_bin = "internal/sonarcli/bundled/sonar-linux-amd64"
sonar_bin_windows = "internal/sonarcli/bundled/sonar-windows-amd64.exe"
# SHA-256 of GitHub's tag archive of the sonar CLI source for PinnedVersion
# (https://github.com/SonarSource/sonarqube-cli/archive/refs/tags/<version>.tar.gz).
# Update it together with PinnedVersion in internal/sonarcli/install.go.
sonar_source_sha256 = "0d714bbefe108de876aa5a8af4b21c504a4b93e849c95a5eddb9c59d5648836d"
ldflags = '-s -w -X github.com/dansailer/sqa/internal/cli.version=${VERSION:-dev} -X github.com/dansailer/sqa/internal/cli.commit=${COMMIT:-$(git rev-parse HEAD 2>/dev/null)}'

[tasks.build]
description = "Build ./sqa without a bundled sonar (uses sonar.path, `sqa setup` or PATH)"
env = { CGO_ENABLED = "0" }
run = 'go build -trimpath -ldflags "{{vars.ldflags}}" -o sqa ./cmd/sqa'

[tasks.fetch-sonar]
description = "Download the pinned sonar for linux/amd64 and verify its SHA-256"
run = "go run ./tools/fetch-sonar -os linux -arch amd64 -o {{vars.sonar_bin}}"

[tasks.fetch-sonar-windows]
description = "Download the pinned sonar for windows/amd64 and verify its SHA-256"
run = "go run ./tools/fetch-sonar -os windows -arch amd64 -o {{vars.sonar_bin_windows}}"

[tasks.fetch-sonar-source]
description = "Download the sonar CLI source for the pinned version (GPL-3 §6(d)) to dist/ and verify its SHA-256"
run = """
set -eu
version="$(go run ./tools/fetch-sonar -print-version)"
want="{{vars.sonar_source_sha256}}"
out="dist/sonarqube-cli-${version}-source.tar.gz"
mkdir -p dist
curl -fsSL --proto '=https' --max-time 120 -o "${out}.tmp" \
  "https://github.com/SonarSource/sonarqube-cli/archive/refs/tags/${version}.tar.gz"
got="$(sha256sum "${out}.tmp" | cut -d' ' -f1)"
if [ "${got}" != "${want}" ]; then
  rm -f "${out}.tmp"
  echo "fetch-sonar-source: sha256 ${got} does not match pinned ${want}" >&2
  exit 1
fi
mv "${out}.tmp" "${out}"
echo "${out}: sha256 ${got} verified"
"""

[tasks.go-licenses]
description = "Copy the licence files of all Go modules in sqa (and Go itself) to build/licenses/go"
run = "go run ./tools/go-licenses -o build/licenses/go"

[tasks.sonar-version]
description = "Print the pinned sonar version"
quiet = true
run = "go run ./tools/fetch-sonar -print-version"

[tasks.build-bundled]
description = "Build linux/amd64 ./sqa with the official sonar embedded"
depends = ["fetch-sonar"]
env = { CGO_ENABLED = "0", GOOS = "linux", GOARCH = "amd64" }
run = [
  'go build -tags bundled_sonar -trimpath -ldflags "{{vars.ldflags}}" -o sqa ./cmd/sqa',
  "ls -l sqa",
]

[tasks.build-bundled-windows]
description = "Cross-compile windows/amd64 ./sqa.exe with the official sonar embedded"
depends = ["fetch-sonar-windows"]
env = { CGO_ENABLED = "0", GOOS = "windows", GOARCH = "amd64" }
run = [
  'go build -tags bundled_sonar -trimpath -ldflags "{{vars.ldflags}}" -o sqa.exe ./cmd/sqa',
  "ls -l sqa.exe",
]

[tasks.build-windows]
description = "Cross-compile ./sqa.exe for windows/amd64 (unbundled)"
env = { CGO_ENABLED = "0", GOOS = "windows", GOARCH = "amd64" }
run = 'go build -trimpath -ldflags "{{vars.ldflags}}" -o sqa.exe ./cmd/sqa'

[tasks.vet-windows]
description = "go vet for the windows/amd64 target"
env = { CGO_ENABLED = "0", GOOS = "windows", GOARCH = "amd64" }
run = "go vet ./..."

[tasks.test]
description = "Run the tests with the race detector"
run = "go test -race ./..."

[tasks.test-bundled]
description = "go vet and tests with -tags bundled_sonar, including the embedded-binary check"
depends = ["fetch-sonar"]
run = [
  "go vet -tags bundled_sonar ./...",
  "go test -race -tags bundled_sonar ./...",
]

[tasks.lint-sh]
description = "shellcheck install.sh and its tests"
run = "shellcheck install.sh testdata/install/test.sh"

[tasks.test-install]
description = "Run install.sh against a local fake release (checksum mismatch included)"
run = "sh testdata/install/test.sh"

[tasks.lint]
description = "go vet, golangci-lint and shellcheck"
run = ["go vet ./...", "golangci-lint run", { task = "lint-sh" }]

[tasks.vulncheck]
description = "Scan dependencies and code for known vulnerabilities (govulncheck)"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./..."

[tasks.clean]
description = "Remove built binaries and fetched sonar binaries"
run = "rm -f sqa sqa.exe {{vars.sonar_bin}} {{vars.sonar_bin_windows}}"

[tasks.all]
description = "test, test-install, lint-sh, go-licenses, then linux and windows builds"
depends = ["test"]
run = [{ task = "test-install" }, { task = "lint-sh" }, { task = "go-licenses" }, { task = "build" }, { task = "vet-windows" }, { task = "build-windows" }]
